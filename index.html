<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Einkauf">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F2F5F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1513" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<title>Einkaufslotse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
  --bg:#F2F5F3;--surface:#FFFFFF;--ink:#16231E;--muted:#5D6B66;--line:#DCE3E0;--soft:#E4EDE9;
  --accent:#0E6E55;--accent-ink:#FFFFFF;--hi:#FFD84A;--hi-ink:#2A2200;--warn:#B4432F;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1513;--surface:#18211E;--ink:#E8EFEC;--muted:#93A39D;--line:#2A3632;--soft:#22302B;
    --accent:#3FBF94;--accent-ink:#06221A;--hi:#E9C33A;--hi-ink:#231B00;--warn:#F08A74;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1513;--surface:#18211E;--ink:#E8EFEC;--muted:#93A39D;--line:#2A3632;--soft:#22302B;
  --accent:#3FBF94;--accent-ink:#06221A;--hi:#E9C33A;--hi-ink:#231B00;--warn:#F08A74;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
body.locked{overflow:hidden}
main{max-width:560px;margin:0 auto;padding:0 16px 120px}
h1,h2{font-weight:800;letter-spacing:-0.02em;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.hint{font-size:.88rem;color:var(--muted)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:16px 0 12px}
header.top h1{font-size:2rem;line-height:1.1}
.sub{margin-top:4px;color:var(--muted)}
.sub strong{color:var(--ink);font-variant-numeric:tabular-nums}

.btn{font:inherit;font-weight:600;border:0;border-radius:14px;padding:12px 18px;min-height:50px;cursor:pointer;background:var(--soft);color:var(--ink);width:100%;touch-action:manipulation}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.go{background:var(--accent);color:var(--accent-ink);font-size:1.15rem;min-height:58px}
.btn.big{min-height:88px;font-size:1.7rem;border-radius:22px;letter-spacing:-0.01em}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.danger{color:var(--warn)}
.btn.small{min-height:42px;padding:8px 14px;font-size:.95rem;width:auto}
.btn:disabled{opacity:.35}
.btn:active:not(:disabled){transform:scale(.98)}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px}

textarea,input,select{font:inherit;font-size:17px;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);color:var(--ink)}
textarea{resize:vertical}
.banner{background:var(--hi);color:var(--hi-ink);padding:10px 14px;border-radius:12px;margin-bottom:12px;font-size:.92rem}

.add{display:grid;gap:10px;margin:4px 0 16px}
.group{margin-top:22px}
.group h2{font-size:1.05rem;display:flex;gap:8px;align-items:center;margin:0 0 8px}
.rows{list-style:none;margin:0;padding:0;background:var(--surface);border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.rows li+li{border-top:1px solid var(--line)}
.row{all:unset;box-sizing:border-box;display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;padding:13px 16px;cursor:pointer}
.row.static{cursor:default;padding:8px 10px 8px 16px}
.row:focus-visible{outline:3px solid var(--hi);outline-offset:-3px}
.r-main{display:flex;flex-direction:column;min-width:0;flex:1}
.r-name{overflow-wrap:anywhere}
.r-note{font-size:.85rem;color:var(--muted)}
.r-price{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.95rem}
.row.done .r-name{text-decoration:line-through;color:var(--muted)}
.row.missing .r-price{color:var(--warn)}
.q{color:var(--warn)}
.qty{color:var(--accent)}
.after-list{margin-top:26px}

/* Einkaufen */
.shop{display:flex;flex-direction:column;gap:14px;padding-top:16px}
.progress{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .3s ease}
.shop-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.95rem;font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:26px;padding:22px 22px 26px;animation:in .22s ease-out}
.card.newsec{border:2px solid var(--accent)}
.sec{display:inline-flex;gap:8px;align-items:center;background:var(--hi);color:var(--hi-ink);font-weight:600;padding:7px 14px;border-radius:99px;font-size:1rem}
.flag{font-size:.9rem;color:var(--accent);font-weight:600;margin-top:10px}
.item{font-size:clamp(2.3rem,11vw,3.6rem);line-height:1.02;margin:20px 0 12px;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;letter-spacing:-0.03em}
.amount{font-size:1.45rem}
.price{color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}
.from{color:var(--muted);margin-top:4px;font-size:.92rem}
.next{color:var(--muted);padding:0 4px}
.next strong{color:var(--ink)}
.shop-actions{display:grid;gap:10px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.finish,.empty{text-align:center;padding:40px 8px 0;display:grid;gap:14px}
.finish .anchor{font-size:3.4rem;line-height:1}
.finish h1,.empty h1{font-size:2.2rem}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Gerichte */
.dishes{display:grid;gap:12px;margin-top:14px}
.dish{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.dish h2{font-size:1.25rem}
.dish-actions{display:flex;gap:8px;flex-wrap:wrap}

/* Markt */
.block{margin-top:26px;display:grid;gap:10px}
.block h2{font-size:1.25rem}
.order{list-style:none;padding:0;margin:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;counter-reset:o;overflow:hidden}
.order li{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 14px;counter-increment:o}
.order li+li{border-top:1px solid var(--line)}
.order li::before{content:counter(o);font-variant-numeric:tabular-nums;color:var(--muted);min-width:1.5em}
.order .lbl{flex:1}
.iconbtn{all:unset;width:42px;height:42px;display:grid;place-items:center;border-radius:10px;background:var(--soft);cursor:pointer;flex:none;font-size:1.05rem}
.iconbtn:disabled{opacity:.3;cursor:default}
.iconbtn:focus-visible{outline:3px solid var(--hi)}

/* Navigation */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-top:1px solid var(--line);padding:4px 4px env(safe-area-inset-bottom,0px)}
nav.tabs button{all:unset;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0 8px;font-size:.74rem;font-weight:600;color:var(--muted);cursor:pointer;position:relative}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button:focus-visible{outline:3px solid var(--hi);outline-offset:-3px;border-radius:10px}
nav svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.badge{position:absolute;top:2px;left:calc(50% + 8px);background:var(--accent);color:var(--accent-ink);font-size:.7rem;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;font-variant-numeric:tabular-nums}

/* Sheet */
#sheet{position:fixed;inset:0;z-index:50}
#sheet[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.42)}
.panel{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:88%;overflow:auto;background:var(--surface);border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;animation:up .2s ease-out}
.panel h2{font-size:1.45rem}
label.f{display:grid;gap:6px;font-weight:600;font-size:.95rem}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;gap:6px}
.stepper input{text-align:center;padding:12px 4px}
.stepper button{font:inherit;font-size:1.3rem;border:0;border-radius:12px;background:var(--soft);color:var(--ink);cursor:pointer}
label.check{display:flex;gap:12px;align-items:center;font-weight:400}
label.check input{width:22px;height:22px;flex:none;accent-color:var(--accent);margin:0}
.checks{display:grid}
.checks label{padding:11px 2px;border-bottom:1px solid var(--line)}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}

#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center}
#toast.show{opacity:1}

@media (prefers-reduced-motion:reduce){
  .card,.panel{animation:none}
  .progress span,#toast{transition:none}
}
</style>
</head>

const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,6);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s).toLowerCase().replace(/\s+/g," ").trim();
const eur = n => n.toLocaleString("de-DE",{style:"currency",currency:"EUR"});
const sum = list => list.reduce((a,i) => a + (i.price != null ? i.price * i.count : 0), 0);
const parsePrice = s => { const n = parseFloat(String(s).replace("€","").replace(",",".").trim()); return isFinite(n) && n >= 0 ? Math.round(n*100)/100 : null; };

function defaults(){
  return {items:[],dishes:SAMPLE_DISHES.map(d=>({...d})),order:CATS.map(c=>c[0]),custom:{},hist:[],tab:"list"};
}
function normalize(d){
  const base = defaults();
  if(!d || typeof d !== "object") return base;
  const s = {...base, ...d};
  const ord = Array.isArray(s.order) ? s.order.filter(c => CAT[c]) : [];
  s.order = [...ord, ...CATS.map(c=>c[0]).filter(c => !ord.includes(c))];
  if(!Array.isArray(s.items)) s.items = [];
  if(!Array.isArray(s.dishes)) s.dishes = [];
  if(!Array.isArray(s.hist)) s.hist = [];
  if(!s.custom || typeof s.custom !== "object") s.custom = {};
  s.items.forEach(i => { if(!CAT[i.cat]) i.cat = "sonst"; if(!["open","done","missing"].includes(i.status)) i.status = "open"; i.count = Math.max(1, parseInt(i.count)||1); });
  if(!["list","shop","dishes","store"].includes(s.tab)) s.tab = "list";
  return s;
}
function load(){
  try { return normalize(JSON.parse(localStorage.getItem(KEY) || "null")); }
  catch(e){ return defaults(); }
}

function lookup(name){
  const n = norm(name);
  if(S.custom[n]) return {cat:S.custom[n].cat, price:S.custom[n].price};
  let best = null, bestLen = 0;
  for(const e of DB){
    if(e.kw.startsWith("=")){
      if(n === e.kw.slice(1) && 100 > bestLen){ best = e; bestLen = 100; }
    } else if(e.kw.length > bestLen && n.includes(e.kw)){
      best = e; bestLen = e.kw.length;
    }
  }
  return best ? {cat:best.cat, price:best.price} : {cat:"sonst", price:null};
}

function splitText(t){
  return String(t).replace(/(\d),(\d)/g,"$1\u0001$2")
    .split(/\n|;|,|\s+und\s+/i)
    .map(x => x.replace(/\u0001/g,",").trim())
    .filter(Boolean);
}
const NUMWORDS = {ein:1,eine:1,einen:1,einem:1,einer:1,eins:1,zwei:2,drei:3,vier:4,"fünf":5,sechs:6,sieben:7,acht:8,neun:9,zehn:10,elf:11,"zwölf":12};
const UNIT = {kg:"kg",kilo:"kg",kilogramm:"kg",g:"g",gr:"g",gramm:"g",ml:"ml",milliliter:"ml",l:"l",liter:"l"};
function parseLine(raw){
  let s = String(raw).trim().replace(/^[-•*·„"]+\s*/,"").replace(/[?!.…:;"“]+$/,"").trim();
  let prev;
  do {
    prev = s;
    s = s.replace(/^(noch|bitte|auch|und|dann|außerdem|mal)\s+/i,"").replace(/\s+(bitte|noch)$/i,"")
         .replace(/^(ein\s+)?(paar|bisschen|wenig|etwas)\s+/i,"");
  } while(s !== prev);
  s = s.replace(/^(eine[nmrs]?|ein|eins|zwei|drei|vier|fünf|sechs|sieben|acht|neun|zehn|elf|zwölf)\s+/i, w => NUMWORDS[w.trim().toLowerCase()] + " ");
  if(!s) return null;
  let count = 1, note = "", m;
  m = s.match(/^(\d+(?:[.,]\d+)?)\s*(kilogramm|kilo|kg|gramm|gr|g|milliliter|ml|liter|l)\.?\s+(.+)$/i);
  if(m){
    const unit = UNIT[m[2].toLowerCase()];
    note = m[1].replace(".",",") + " " + unit; s = m[3];
  } else {
    m = s.match(/^(\d+)\s*(x|×|stk\.?|stück|dosen?|packung(?:en)?|pck\.?|pkg\.?|flaschen?|becher|gläser|glas|bund|netze?|tüten?|beutel|kisten?|kästen|kasten)?\s+(.+)$/i);
    if(m){ count = Math.max(1, parseInt(m[1],10)); s = m[3]; }
  }
  m = s.match(/^(.+?)\s*(?:x|×)\s*(\d+)$/i);
  if(m){ s = m[1]; count = Math.max(1, parseInt(m[2],10)); }
  s = s.trim();
  if(!s) return null;
  return {name: s.charAt(0).toUpperCase() + s.slice(1), count, note};
}
function mergeKey(name){
  let k = norm(name).replace(/[^\p{L}\p{N} -]/gu,"").trim();
  if(k.length > 4) k = k.replace(/(en|n|e|s)$/,"");
  return k;
}
function addParsed(p){
  const n = mergeKey(p.name);
  const ex = S.items.find(i => mergeKey(i.name) === n && i.status !== "done");
  if(ex){
    ex.count += p.count;
    if(p.note && !ex.note) ex.note = p.note;
    if(p.from && !(ex.from||"").includes(p.from)) ex.from = ex.from ? ex.from + ", " + p.from : p.from;
    if(ex.status === "missing") ex.status = "open";
    return;
  }
  const l = lookup(p.name);
  S.items.push({id:uid(), name:p.name, count:p.count, note:p.note||"", from:p.from||"", cat:l.cat, price:l.price, status:"open"});
}
/* Doppelte und diktierte Einträge aufräumen: „Eine Milch?“ + „Zwei Milch“ → 3× Milch */
function consolidate(){
  for(const i of S.items){
    if(i.status === "done") continue;
    const p = parseLine(i.name);
    if(!p || (p.name === i.name && p.count === 1 && !p.note)) continue;
    if(p.count > 1 && i.count === 1) i.count = p.count;
    if(p.note && !i.note) i.note = p.note;
    i.name = p.name;
    if(i.price == null || i.cat === "sonst"){
      const l = lookup(i.name);
      if(i.price == null) i.price = l.price;
      if(i.cat === "sonst") i.cat = l.cat;
    }
  }
  const keep = [];
  for(const i of S.items){
    const ex = i.status !== "done" && keep.find(k => k.status !== "done" && mergeKey(k.name) === mergeKey(i.name));
    if(ex){
      ex.count += i.count;
      if(i.note && !ex.note) ex.note = i.note;
      for(const f of (i.from || "").split(", ").filter(Boolean)){
        if(!(ex.from || "").split(", ").includes(f)) ex.from = ex.from ? ex.from + ", " + f : f;
      }
      if(ex.price == null) ex.price = i.price;
      if(i.status === "open") ex.status = "open";
      S.hist = S.hist.filter(x => x !== i.id);
      continue;
    }
    keep.push(i);
  }
  S.items = keep;
}
function sortedItems(list){
  const idx = Object.fromEntries(S.order.map((c,i) => [c,i]));
  return [...list].sort((a,b) => (idx[a.cat]-idx[b.cat]) || a.name.localeCompare(b.name,"de"));
}

async function wake(on){

    else if(!on && wl){ await wl.release(); wl = null; }

}

function rowHtml(i){
  const sub = [i.note, i.from && "für " + i.from].filter(Boolean).join(", ");
  const right = i.status === "done" ? "im Wagen" : i.status === "missing" ? "nicht gefunden" : (i.price == null ? `<span class="q">Preis?</span>` : eur(i.price * i.count));

}

function viewShop(){
  const items = sortedItems(S.items);
  if(!items.length){
    return `<div class="empty"><h1>Nichts zu holen</h1><p class="muted">Schreib erst etwas auf die Einkaufsliste oder pack ein Gericht in den Wagen.</p><button class="btn go" data-a="tab" data-tab="list">Zur Einkaufsliste</button></div>`;
  }
  const open = items.filter(i => i.status === "open");
  const done = items.filter(i => i.status === "done");
  const miss = items.filter(i => i.status === "missing");
  const pos = items.length - open.length;
  const pct = Math.round(pos / items.length * 100);
  if(!open.length){
    return `<div class="finish">
      <div class="anchor" aria-hidden="true">⚓</div>
      <h1>Alles erledigt</h1>
      <p>${done.length} Artikel im Wagen, geschätzt <strong>${eur(sum(done))}</strong>.</p>
      ${miss.length ? `<p class="muted">Nicht gefunden: ${miss.map(i => esc(i.name)).join(", ")}</p>` : ""}
      <button class="btn go" data-a="finish">Einkauf abschließen</button>
      <p class="hint">Gekauftes verschwindet von der Liste, nicht Gefundenes bleibt drauf.</p>
      ${S.hist.length ? `<button class="btn ghost" data-a="back">Zurück zum letzten Artikel</button>` : ""}
    </div>`;
  }
  const cur = open[0], next = open[1];
  const lastId = S.hist[S.hist.length - 1];
  const last = lastId ? S.items.find(i => i.id === lastId) : null;
  const newSec = last && last.cat !== cur.cat;
  const c = CAT[cur.cat];
  return `<div class="shop">
    <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><span style="width:${pct}%"></span></div>

    <article class="card ${newSec ? "newsec" : ""}" aria-live="polite">
      <div class="sec"><span aria-hidden="true">${c.icon}</span>${c.label}</div>

      <p class="amount"><b>${cur.count}×</b>${cur.note ? " " + esc(cur.note) : ""}</p>
      <p class="price">${cur.price != null ? "ca. " + eur(cur.price * cur.count) : "Preis unbekannt"}</p>
      ${cur.from ? `<p class="from">für ${esc(cur.from)}</p>` : ""}
    </article>
    <p class="next">${next ? `Danach: <strong>${esc(next.name)}</strong>${next.cat !== cur.cat ? `, dann geht’s zu ${CAT[next.cat].label}` : ""}` : "Das ist der letzte Artikel."}</p>
    <div class="shop-actions">

        <button class="btn ghost" data-a="miss">Nicht gefunden</button>
      </div>
    </div>
  </div>`;
}

    <label class="f">Zutaten<textarea id="d-ing" rows="8" placeholder="Eine Zutat pro Zeile, z. B.&#10;500 g Hackfleisch&#10;2 Dosen gehackte Tomaten&#10;Spaghetti">${esc(d.ingredients)}</textarea></label>
    <label class="f">Notizen<textarea id="d-notes" rows="3" placeholder="Zubereitung, Tipps (optional)">${esc(d.notes || "")}</textarea></label>
    <button class="btn primary" data-a="saveDish" data-id="${d.id}">Speichern</button>
    ${id ? `<button class="btn ghost danger" data-a="delDish" data-id="${d.id}">Gericht löschen</button>` : ""}
    <button class="btn ghost" data-a="closeSheet">Abbrechen</button>`);
}
function mark(status){
  const cur = sortedItems(S.items).find(i => i.status === "open");
  if(!cur) return;
  cur.status = status; S.hist.push(cur.id);
  save(); render(); window.scrollTo(0,0);
}

/* ---------- Aktionen ---------- */
const A = {
  tab: d => { S.tab = d.tab; save(); closeSheet(); render(); window.scrollTo(0,0); },
  add: () => {
    const ta = $("#add-input"); const parts = splitText(ta.value).map(parseLine).filter(Boolean);
    if(!parts.length){ ta.focus(); return; }
    parts.forEach(addParsed); save(); render();
    toast(parts.length === 1 ? `${parts[0].name} hinzugefügt` : `${parts.length} Artikel hinzugefügt`);
  },
  editItem: d => editItem(d.id),
  step: d => { const f = $("#f-count"); f.value = Math.max(1, (parseInt(f.value)||1) + Number(d.delta)); },
  saveItem: d => {
    const it = S.items.find(i => i.id === d.id); if(!it){ closeSheet(); return; }
    const name = $("#f-name").value.trim() || it.name;
    Object.assign(it, {name, count:Math.max(1, parseInt($("#f-count").value)||1), note:$("#f-note").value.trim(), cat:$("#f-cat").value, price:parsePrice($("#f-price").value)});
    if($("#f-remember").checked) S.custom[norm(name)] = {name, cat:it.cat, price:it.price};
    consolidate();
    save(); closeSheet(); render();
  },
  reopenItem: d => { const it = S.items.find(i => i.id === d.id); if(it) it.status = "open"; S.hist = S.hist.filter(x => x !== d.id); save(); closeSheet(); render(); },
  delItem: d => { S.items = S.items.filter(i => i.id !== d.id); S.hist = S.hist.filter(x => x !== d.id); save(); closeSheet(); render(); },
  clearList: () => askConfirm("Ganze Einkaufsliste leeren?", "Liste leeren", () => { S.items = []; S.hist = []; }),
  got: () => mark("done"),
  miss: () => mark("missing"),
  back: () => { const id = S.hist.pop(); const it = S.items.find(i => i.id === id); if(it) it.status = "open"; save(); render(); },
  finish: () => {
    S.items = S.items.filter(i => i.status !== "done");
    S.items.forEach(i => i.status = "open");
    S.hist = []; S.tab = "list"; save(); render(); window.scrollTo(0,0); toast("Einkauf abgeschlossen");
  },
  newDish: () => editDish(null),
  editDish: d => editDish(d.id),
  saveDish: d => {
    const name = $("#d-name").value.trim();
    if(!name){ toast("Gib dem Gericht einen Namen."); $("#d-name").focus(); return; }
    const data = {name, ingredients:$("#d-ing").value.trim(), notes:$("#d-notes").value.trim()};
    const ex = d.id && S.dishes.find(x => x.id === d.id);
    if(ex) Object.assign(ex, data); else S.dishes.push({id:uid(), ...data});
    save(); closeSheet(); render(); toast("Gericht gespeichert");
  },
  delDish: d => askConfirm("Gericht löschen?", "Löschen", () => { S.dishes = S.dishes.filter(x => x.id !== d.id); }),
  dishToCart: d => {
    const dish = S.dishes.find(x => x.id === d.id); if(!dish) return;
    const lines = splitText(dish.ingredients).map(parseLine).filter(Boolean);
    if(!lines.length){ toast("Dieses Gericht hat noch keine Zutaten."); return; }
    pendingDish = {dish, lines};
    openSheet(`<h2>${esc(dish.name)}</h2>
      <p class="hint">Was hast du schon zu Hause? Nimm dort den Haken raus.</p>
      <div class="checks">${lines.map((p,k) => `<label class="check"><input type="checkbox" data-k="${k}" checked><span>${p.count > 1 ? `${p.count}× ` : ""}${esc(p.name)}${p.note ? ` <span class="muted">${esc(p.note)}</span>` : ""}</span></label>`).join("")}</div>
      <button class="btn go" data-a="confirmDish">Auf die Einkaufsliste</button>
      <button class="btn ghost" data-a="closeSheet">Abbrechen</button>`);
  },
  confirmDish: () => {
    if(!pendingDish) return;
    let n = 0;
    document.querySelectorAll(".checks input[type=checkbox]").forEach(cb => {
      if(cb.checked){ addParsed({...pendingDish.lines[+cb.dataset.k], from:pendingDish.dish.name}); n++; }
    });
    pendingDish = null; save(); closeSheet(); render();
    toast(n ? `${n} ${n === 1 ? "Zutat" : "Zutaten"} auf der Liste` : "Nichts hinzugefügt");
  },
  moveCat: d => {
    const i = +d.i, j = i + (+d.dir);
    if(j < 0 || j >= S.order.length) return;
    [S.order[i], S.order[j]] = [S.order[j], S.order[i]]; save(); render();
  },
  delCustom: d => { delete S.custom[d.key]; save(); render(); },
  exportData: () => {
    const data = {v:1, items:S.items, dishes:S.dishes, order:S.order, custom:S.custom};
    openSheet(`<h2>Daten exportieren</h2>
      <p class="hint">Kopiere diesen Text, schick ihn dir zum Beispiel per Nachricht und füge ihn auf dem anderen iPhone unter „Daten importieren“ ein.</p>
      <textarea id="ex" rows="7" readonly>${esc(JSON.stringify(data))}</textarea>
      <button class="btn primary" data-a="copyExport">Kopieren</button>
      <button class="btn ghost" data-a="closeSheet">Schließen</button>`);
  },
  copyExport: async () => {
    const t = $("#ex");
    try { await navigator.clipboard.writeText(t.value); toast("Kopiert"); }
    catch(e){ t.focus(); t.setSelectionRange(0, t.value.length); toast("Text markiert – jetzt kopieren"); }
  },
  importData: () => openSheet(`<h2>Daten importieren</h2>
    <p class="hint">Füge den exportierten Text ein. Das ersetzt Liste, Gerichte, Laufweg und gemerkte Preise auf diesem Gerät.</p>
    <textarea id="im" rows="7" placeholder="Hier einfügen"></textarea>
    <button class="btn primary" data-a="doImport">Importieren</button>
    <button class="btn ghost" data-a="closeSheet">Abbrechen</button>`),
  doImport: () => {
    try{
      const d = JSON.parse($("#im").value);
      if(!d || !Array.isArray(d.dishes) || !Array.isArray(d.items)) throw new Error();
      const tab = S.tab; S = normalize(d); S.tab = tab; S.hist = []; consolidate();
      save(); closeSheet(); render(); toast("Daten importiert");
    }catch(e){ toast("Das ist kein gültiger Export."); }
  },
  resetAll: () => askConfirm("Alles zurücksetzen? Liste, Gerichte, Laufweg und gemerkte Preise werden gelöscht.", "Alles löschen", () => { S = defaults(); S.tab = "store"; }),
  confirmYes: () => { const fn = pendingConfirm; pendingConfirm = null; if(fn) fn(); save(); closeSheet(); render(); },
  closeSheet: () => { pendingConfirm = null; pendingDish = null; closeSheet(); }
};

document.addEventListener("click", e => {
  const b = e.target.closest("[data-a]");
  if(!b || b.disabled) return;
  const fn = A[b.dataset.a];
  if(fn){ e.preventDefault(); fn(b.dataset, b); }
});

consolidate();
save();
render();
</script>
</body>
</html>
